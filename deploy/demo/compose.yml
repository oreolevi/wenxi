name: wenxi-demo
services:
  wenxi-demo-web:
    image: wenxi-demo:${APP_RELEASE:?set APP_RELEASE}
    container_name: wenxi-demo-web
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 40
    expose: ["8080"]
    networks: [proxy]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
networks:
  proxy:
    external: true
    name: app_default
