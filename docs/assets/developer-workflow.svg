="#68748a" font-weight="400" text-anchor="start">单份测试 · 批量回放</text><path d="M586 73H601" fill="none" stroke="#3564df" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="606" y="28" width="170" height="88" rx="8" fill="#f8faff" stroke="#bdcff5"/><text x="620" y="50" font-size="11" fill="#3564df" font-weight="600" text-anchor="start">04</text><text x="620" y="74" font-size="15" fill="#243047" font-weight="600" text-anchor="start">发布版本</text><text x="620" y="99" font-size="11" fill="#68748a" font-weight="400" text-anchor="start">版本号 · 服务 ID</text><path d="M691 116V154H190V198" fill="none" stroke="#3564df" stroke-width="1.5" marker-end="url(#arrow)" /><path d="M691 154V198" fill="none" stroke="#3564df" stroke-width="1.5" marker-end="url(#arrow)" /><text x="190" y="185" font-size="12" fill="#68748a" font-weight="400" text-anchor="middle">单类材料</text><text x="605" y="185" font-size="12" fill="#68748a" font-weight="400" text-anchor="middle">多类材料</text><rect x="24" y="202" width="330" height="84" rx="8" fill="#f3f6ff" stroke="#c8d6f6"/><text x="46" y="232" font-size="16" fill="#3564df" font-weight="600" text-anchor="start">独立服务 API</text><text x="46" y="257" font-size="13" fill="#243047" font-weight="400" text-anchor="start">直接接入业务系统</text><text x="46" y="276" font-size="11" fill="#68748a" font-weight="400" text-anchor="start">服务可被多个项目复用</text><rect x="434" y="202" width="342" height="84" rx="8" fill="#ffffff" stroke="#dce3ed"/><text x="456" y="232" font-size="16" fill="#243047" font-weight="600" text-anchor="start">场景编排</text><text x="456" y="257" font-size="13" fill="#243047" font-weight="400" text-anchor="start">引用多项服务的固定版本</text><text x="456" y="276" font-size="11" fill="#68748a" font-weight="400" text-anchor="start">设置必需材料和数量约束</text><path d="M605 286V318" fill="none" stroke="#3564df" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="434" y="322" width="342" height="58" rx="8" fill="#f3f6ff" stroke="#c8d6f6"/><text x="605" y="347" font-size="14" fill="#3564df" 