name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: document-extraction-ui/package-lock.json
      - run: npm ci
        working-directory: document-extraction-ui
      - run: npm test
        working-directory: document-extraction-ui
      - run: npm run build:live
        working-directory: document-extraction-ui
      - run: npm run build:demo
        working-directory: document-extraction-ui

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEEPSEEK_API_KEY: ''
      MINERU_API_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: deploy/live/requirements.txt
      - run: python .github/scripts/check_repository.py
      - run: python -m pip install -r deploy/live/requirements.txt reportlab==5.1.0
      - run: node --test mineru-local/deepseek/client.test.mjs
      - run: python -m unittest discover -s mineru-local -t mineru-local -p 'test_*.py'
