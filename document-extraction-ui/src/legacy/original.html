<script>
'use strict';
const KEY='document-platform-v36';
const defaults={page:'business',name:'采购合同要素提取',fields:[{name:'合同编号',desc:'合同唯一编号'},{name:'甲方名称',desc:'采购方主体全称'},{name:'乙方名称',desc:'供应商主体全称'},{name:'合同金额',desc:'含税总额，统一为元'}],tasks:['字段提取'],files:['采购合同_样式A.pdf','采购合同_样式B.pdf'],groups:false,groupFields:{},trial:false,merged:false,edits:0,revision:1,evalRevision:0,evaluated:false,approved:false,registered:false,bound:false,restricted:false,requests:[],chat:[],file:'scene.yaml',code:'',fileContents:{},tableColumns:['商品名称','数量','单价','金额'],aiPending:false,locked:false,checkpoint:null,codeDeployed:false,batch:[],issue:'待核验',reviewed:false,appVersion:'1.0.0',pool:16,queue:4,feedback:0,verifiedValue:'128000.00',reviewReason:'识别 / 转换错误',goal:'提取合同编号、双方名称和含税总金额。',groupNames:{A:'样式A',B:'样式B'}};
let saved;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}let s={...JSON.parse(JSON.stringify(defaults)),...saved};let tabState={tools:'tools',release:'config',ops:'quality',eval:'report'};let running=false;let uploadTarget='sample';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pages=[['overview','◈','工作概览'],['scenes','▦','场景目录'],['business','▤','业务提取配置'],['batch','▧','批量任务'],['develop','⌘','AI 开发工作台'],['tools','◇','工具与 SOP'],['evaluation','◉','复核与评测'],['release','⇧','启用与发布'],['services','⇄','服务接入'],['review','☷','执行与核验'],['operations','▥','质量运营'],['resources','⚙','权限资源']];
const badge=(t,c='')=>`<span class="badge ${c}">${t}</span>`;
const btn=(t,action,cls='')=>`<button class="${cls}" onclick="${esc(action)}">${t}</button>`;
const card=(title,body,extra='')=>`<section class="card"><div class="card-head"><h2>${title}</h2>${extra}</div>${body}</section>`;
const table=(heads,rows)=>`<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const note=(t,c='')=>`<div class="note ${c}">${t}</div>`;
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function touch(){s.revision++;s.evaluated=false;s.trial=false;s.approved=false;save()}
function go(page){s.page=page;save();render();window.scrollTo(0,0)}
function toast(t){document.getElementById('toast').innerHTML=`<div class="toast" role="status">${esc(t)}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',3200)}
function heading(title,sub,actions=''){return `<div class="heading"><div><h1>${title}</h1><p>${sub}</p></div><div class="row">${actions}</div></div>`}
function metrics(items){return `<div class="metric-grid">${items.map(([t,n,sub])=>`<div class="metric"><span class="muted tiny">${t}</span><b>${n}</b><span class="tiny">${sub}</span></div>`).join('')}</div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}
function modal(title,body,footer=''){document.getElementById('modal').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="row spread"><h2>${title}</h2>${btn('×','closeModal()','small')}</div><div class="body">${body}</div><div class="row" style="justify-content:flex-end">${btn('关闭','closeModal()')}${footer}</div></div></div>`}
function download(name,text,type='text/plain;charset=utf-8'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){let test=['develop','tools','evaluation'].includes(s.page);document.getElementById('app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="logo">文</div><div><strong>文档智能解析</strong><div class="tiny muted">DOCUMENT INTELLIGENCE</div></div></div><nav><div class="nav-label">WORKSPACE · 场景与任务</div>${pages.map(([id,icon,name],i)=>`${i===4?'<div class="nav-label">BUILD · 开发与交付</div>':''}${i===10?'<div class="nav-label">MANAGE · 运营与资源</div>':''}<button class="${s.page===id?'active':''}" onclick="go('${id}')"><span class="ico">${icon}</span>${name}</button>`).join('')}</nav><div class="side-foot"><div class="row"><span class="avatar">郭</span><div><strong class="tiny">小郭</strong><div class="muted tiny">智能应用二部</div></div></div><p class="tiny muted" style="margin-top:12px">原型评审视图 · 汇总授权页面<br>实际菜单由上行认证及角色决定</p></div></aside><main><header class="top"><span class="muted tiny">公共服务 / ${pages.find(x=>x[0]===s.page)?.[2]||''}</span><div class="top-meta">${badge(test?'测试环境 · 开发空间':'生产环境 · '+(s.page==='business'?'业务配置空间':'服务空间'),test?'amber':'green')}<span class="muted tiny">V3.6 需求基线</span><span class="avatar" style="width:27px;height:27px;font-size:12px">郭</span></div></header><div class="mobile-nav"><select aria-label="页面导航" onchange="go(this.value)">${pages.map(([id,_,n])=>`<option value="${id}" ${s.page===id?'selected':''}>${n}</option>`).join('')}</select></div><div class="content">${({overview,scenes,business,batch,develop,tools,evaluation,release,services,review,operations,resources})[s.page]()}</div></main></div><div class="stamp">交互原型 · 示例数据与模拟执行</div><input type="file" id="upload" multiple hidden accept=".pdf,.png,.jpg,.jpeg,.docx,.xlsx,.txt" onchange="uploadFiles(this.files)">`}
function overview(){return heading('把文档，变成可用的数据','从提取目标到稳定服务，让同一份能力在不同入口复用。',btn('重新演示','resetDemo()')+btn('新建提取场景','newScene()','primary'))+metrics([['可用场景','12','4 个部门 · 3 类调用入口'],['本月解析文件','28,416','来自批量、系统与智能体'],['待处理事项',String(s.requests.filter(x=>x.status==='待审核').length+3),'发布审核、核验与失败任务'],['模型资源使用','62%','实时与批量分队列运行']])+`<div class="two">${card('开始工作',`<div class="two"><div class="tool"><span class="badge">业务配置</span><h3>上传样例，确认要提取的内容</h3><p>AI推荐字段，人工调整并试跑；发布后直接批量使用。</p>${btn('配置提取目标 →',"go('business')",'small')}</div><div class="tool"><span class="badge">场景开发</span><h3>与 AI 一起开发新场景</h3><p>复用工具和SOP，在工程中调整流程、配置与代码。</p>${btn('打开开发工作台 →',"go('develop')",'small')}</div></div>`)}${card('我的待办',table(['事项','对象','操作'],[['配置审核','采购合同 v1.1',btn('查看',"go('release')",'small')],['字段疑点核验','任务 T-1026-018',btn('核验',"go('review')",'small')],['新版式待适配','流水单表头变化',btn('跟进',"go('operations')",'small')]]))}</div>`+card('最近场景',sceneTable())}
function sceneTable(){return table(['场景 / 负责人','任务组合','草稿 / 服务版本','状态','操作'],[[`<strong>${esc(s.name)}</strong><br><span class="muted">小郭 · 智能应用二部</span>`,'字段 + 表格',`r${s.revision} / v1.0.0`,badge('配置中'),btn('继续配置',"go('business')",'small')],['银行流水解析<br><span class="muted">运营管理部</span>','全文 + 表格','v2.3.1',badge('服务可用','green'),btn('开发迭代',"go('develop')",'small')],['尽调报告解析<br><span class="muted">公司金融部</span>','全文 + 结构 + 语义','v1.2.0',badge('已启用','green'),btn('服务接入',"go('services')",'small')]])}
function scenes(){return heading('场景目录','提取目标、开发工程、服务版本与使用记录统一关联。',btn('新建场景','newScene()','primary'))+card('我的场景',`<div class="row" style="margin-bottom:17px"><input placeholder="搜索场景名称" aria-label="搜索场景" oninput="filterTable(this.value)"><span class="pill">全部状态</span><span class="pill">智能应用二部</span></div><div id="scene-table">${sceneTable()}</div>`)+card('版本关系',`<div class="flow"><div class="node">业务目标<br><b>样例、任务、字段</b></div><span class="arrow">→</span><div class="node">场景修订 r${s.revision}<br><b>方案、工具、执行流程</b></div><span class="arrow">→</span><div class="node">评测与简化审核<br><b>报告、配置快照</b></div><span class="arrow">→</span><div class="node">服务版本 v1.1.0<br><b>按使用方启用</b></div></div>`)}
function filterTable(v){document.querySelectorAll('#scene-table tbody tr').forEach(r=>r.hidden=!r.textContent.includes(v))}
function resetDemo(){modal('重新演示',`<p>恢复本原型的默认样例和交互状态。</p>`,btn('恢复默认',"s=JSON.parse(JSON.stringify(defaults));save();closeModal();render()",'primary'))}
function newScene(){modal('新建提取场景',`<label>场景名称</label><input id="new-name" placeholder="例如：销售合同要素提取"><label>从哪里开始</label><select id="new-mode"><option value="business">业务提取配置 · 样例与字段</option><option value="develop">AI 开发工作台 · 配置、流程与代码</option></select>`,btn('创建',"createScene()",'primary'))}
function createScene(){let n=document.getElementById('new-name').value.trim();if(!n)return toast('请填写场景名称');s.name=n;s.revision++;s.trial=false;s.evaluated=false;let p=document.getElementById('new-mode').value;closeModal();go(p)}
function taskPicker(){return `<div class="task-picker">${['全文解析','字段提取','表格明细','结构还原','语义要素'].map(t=>`<label><input type="checkbox" ${s.tasks.includes(t)?'checked':''} onchange="toggleTask('${t}',this.checked)">${t}</label>`).join('')}</div>`}
function business(){return heading('业务提取配置','告诉平台需要什么，再用样例确认效果。',`<span class="pill">草稿 r${s.revision}</span>${btn('保存草稿','saveDraft()')}${btn('提交简化审核','submitChange()','primary')}`)+`<div class="steps"><div class="step on"><b>1</b>上传样例</div><div class="step on"><b>2</b>确认提取内容</div><div class="step ${s.trial?'on':''}"><b>3</b>试跑与评测</div><div class="step ${s.registered?'on':''}"><b>4</b>审核后启用</div></div><div style="margin-bottom:18px"><input style="font-size:15px;font-weight:bold;width:360px" aria-label="场景名称" value="${esc(s.name)}" onchange="s.name=this.value;touch()"> <span class="tiny muted">所属部门：智能应用二部 · 负责人：小郭</span></div><div class="cols"><section class="card"><div class="card-head"><h2><span class="badge">01</span> 样例文档</h2>${btn('选模板','templateModal()','small')}</div><div class="upload" onclick="pickFiles('sample')"><div class="symbol">⇧</div><b class="tiny">点击上传或添加样例</b><p class="tiny muted">PDF / 图片 / Word / Excel / TXT</p></div>${s.files.map((f,i)=>`<div class="file ${i===0?'selected':''}"><div class="row"><span class="file-icon">${esc(f.split('.').pop().toUpperCase())}</span><div><b class="tiny">${esc(f)}</b><div class="tiny muted">${i<2?'演示样例 · ':''}样式${i%2?'B':'A'}</div></div></div>${btn('预览',`samplePreview(${i})`,'small')}</div>`).join('')}<label class="tiny muted" style="display:block;margin:18px 0 7px">补充说明（可选）</label><textarea id="goal" onchange="s.goal=this.value;touch()" placeholder="例如：提取合同双方、含税总额，保留商品明细">${esc(s.goal)}</textarea><div class="row" style="margin-top:12px">${btn('✦ AI 推荐提取内容','recommend()','primary small')}${btn('手动填写','addField()','small')}</div>${note('样例用于确认提取目标；此原型上传仅保存在当前浏览器。')}</section><section class="card"><div class="card-head"><h2><span class="badge">02</span> 需要提取的内容</h2></div>${taskPicker()}${s.tasks.includes('字段提取')?`<div class="row spread tiny muted"><span>字段名称</span><span>提取要求（可选）</span></div><div id="fields">${s.fields.map((f,i)=>`<div class="field-row"><input aria-label="字段${i+1}名称" value="${esc(f.name)}" onchange="s.fields[${i}].name=this.value;touch()"><input aria-label="字段${i+1}要求" value="${esc(f.desc)}" onchange="s.fields[${i}].desc=this.value;touch()">${btn('↑',`moveField(${i})`)}${btn('×',`removeField(${i})`)}</div>`).join('')}</div>${btn('＋ 添加字段','addField()','small')}`:''}${s.tasks.includes('表格明细')?`<div class="line"></div><div class="row spread"><h3>明细列</h3>${btn('调整','columnsModal()','small')}</div><p class="tiny muted" style="margin-top:7px">${s.tableColumns.map(esc).join(' · ')}</p>`:''}${s.tasks.includes('全文解析')?note('全文输出保留阅读顺序，可同时包含表格和字段结果。'):''}${s.tasks.includes('结构还原')?note('保留标题层级、章节、段落与表格位置。'):''}${s.tasks.includes('语义要素')?`<label class="tiny muted">语义提取要求</label><textarea placeholder="例如：提取付款条件并附原文依据" onchange="touch()"></textarea>`:''}<details ${s.groups?'open':''} ontoggle="s.groups=this.open;save()"><summary>不同文档提取不同字段（按需展开）</summary><div class="tiny muted" style="margin:10px 0">AI按样例推荐分组，勾选每组所需字段。</div>${['A','B'].map((g,i)=>`<div class="file"><span class="file-icon">${g}</span><input aria-label="样式${g}名称" value="${esc(s.groupNames[g])}" onchange="s.groupNames['${g}']=this.value;touch()" style="width:90px"><span class="tiny muted">${i+1}号样例</span></div><div class="task-picker">${s.fields.map((f,j)=>`<label><input type="checkbox" ${s.groupFields[g+'-'+j]===false?'':'checked'} onchange="s.groupFields['${g}-${j}']=this.checked;touch()">${esc(f.name)}</label>`).join('')}</div>`).join('')}</details>${!s.merged?`<div class="note amber">✦ “合同总价”与“合同金额”可能含义相同。<br>${btn('确认合并为合同金额','mergeFields()','small')}</div>`:note('已合并同义名称：合同总价 → 合同金额','green')}</section><section class="card"><div class="card-head"><h2><span class="badge">03</span> 试跑结果</h2>${btn(s.trial?'重新试跑':'开始试跑','runTrial()','primary small')}</div>${s.trial?`<div class="row spread tiny"><span class="muted">样式 A · 示例结果</span>${badge('1 项待核验','amber')}</div><div class="doc" style="min-height:170px;margin-top:12px"><h3>采购合同</h3><p>甲方：上海某贸易有限公司</p><p>乙方：华东某设备有限公司</p><p>合同含税总额：<span class="highlight">人民币 128,000.00 元</span></p></div>${s.fields.map((f,i)=>`<div class="result" onclick="fieldEvidence(${i})"><span class="muted">${esc(f.name)}</span><b>${esc(exampleValue(i))} <span style="color:#94aedc">↗</span></b></div>`).join('')}${s.tasks.includes('表格明细')?`<div class="result"><span>商品明细</span><b>2 行 · 4 列 ${btn('查看','columnsModal()','small')}</b></div>`:''}${s.tasks.includes('全文解析')?note('全文：采购合同\n甲乙双方、金额及商品明细，按原文顺序输出。'):''}${s.tasks.includes('结构还原')?note('结构：采购合同 → 双方信息 / 采购明细 / 付款条款，保留层级与位置。'):''}${s.tasks.includes('语义要素')?note('语义示例：付款条件=验收后付款，关联第2页原文依据。'):''}<label class="tiny muted" style="display:block;margin:14px 0 7px">描述需要调整的地方</label><textarea id="trial-correction" placeholder="例如：这里应提取乙方而非甲方"></textarea><div class="row" style="margin-top:10px">${btn('交给 AI 调整','correctTrial()','small')}${btn('核定并评测',"go('evaluation')",'primary small')}</div>`:`<div class="empty" style="padding:55px 10px"><div style="font-size:38px;color:#b4c8ee">▧</div><p style="margin:15px 0 8px">先确认提取内容，再试跑</p><p class="tiny">原文、结果和依据会在这里对照展示</p></div>`}</section></div><div class="footer-actions"><span class="tiny muted">${s.evaluated&&s.evalRevision===s.revision?'当前修订已有评测报告':'当前修订待评测'} · 发布后可批量使用，也可授权系统或智能体调用</span>${btn('查看批量使用 →',"go('batch')")}</div>`}
function exampleValue(i){return ['HT-2026-1026','上海某贸易有限公司','华东某设备有限公司','128,000.00'][i]||'样例提取值'}
function saveDraft(){save();toast('草稿已保存到当前浏览器')}
function toggleTask(t,v){if(v&&!s.tasks.includes(t))s.tasks.push(t);if(!v)s.tasks=s.tasks.filter(x=>x!==t);touch();render()}
function addField(){s.fields.push({name:'新字段',desc:''});touch();render()}
function moveField(i){if(i===0)return;[s.fields[i-1],s.fields[i]]=[s.fields[i],s.fields[i-1]];touch();render()}
function removeField(i){s.fields.splice(i,1);touch();render()}
function mergeFields(){s.merged=true;touch();render();toast('已保存同义名称映射，下一次试跑将使用该映射')}
function pickFiles(t){uploadTarget=t;document.getElementById('upload').click()}
function uploadFiles(files){if(!files.length)return;if(uploadTarget==='sample'){s.files.push(...Array.from(files,f=>f.name));touch();render();toast('已添加样例，原型仅记录文件名')}else{addBatch(Array.from(files,f=>f.name))}}
function recommend(){let goal=document.getElementById('goal')?.value||'';modal('AI 推荐提取内容',`<span class="badge">基于演示合同样例的模拟建议</span><p style="margin:12px 0">建议提取合同编号、甲方名称、乙方名称、合同金额及签订日期，并保留商品明细。</p>${note('已填写的字段保留；本次增加“签订日期”。')}`,btn('采纳推荐','applyRecommendation()','primary'))}
function applyRecommendation(){if(!s.fields.some(f=>f.name==='签订日期'))s.fields.push({name:'签订日期',desc:'统一为 YYYY-MM-DD'});if(!s.tasks.includes('表格明细'))s.tasks.push('表格明细');touch();closeModal();render();toast('推荐已应用，可直接修改字段')}
function runTrial(){if(!s.tasks.length)return toast('请至少选择一种提取任务');if(!s.files.length)return toast('请先添加样例');s.trial=true;save();render();toast('示例试跑完成，点击结果可查看原文依据')}
function correctTrial(){let v=document.getElementById('trial-correction').value.trim();if(!v)return toast('请填写调整要求');s.chat.push({role:'user',text:v});touch();s.trial=true;save();render();toast('模拟调整已记录；当前修订需重新评测')}
function samplePreview(i){modal(esc(s.files[i]),`<div class="doc"><h3>采购合同 · 演示内容</h3><p>合同编号：HT-2026-1026</p><p>甲方：上海某贸易有限公司</p><p>乙方：华东某设备有限公司</p><p>合同含税总额：<span class="highlight">人民币128,000.00元</span></p><p>文件名、表头及正文关键词可用于匹配提取方案。</p></div><p class="tiny muted" style="margin-top:10px">此处为演示原文，用户上传文件在本原型中记录为样例条目。</p>`)}
function fieldEvidence(i){modal('原文依据 · '+esc(s.fields[i].name),`<div class="doc"><h3>采购合同</h3><p>第1页 · 内容块 block-${i+1}</p><p><span class="highlight">${esc(s.fields[i].name)}：${esc(exampleValue(i))}</span></p></div>${note('结果与页码、内容块及实际场景版本关联。')}`)}
function columnsModal(){modal('明细提取定义',table(['列名','含义','示例'],[['商品名称','采购项目名称','设备 A'],['数量','本行采购数量','2'],['单价','含税单价，元','32,000'],['金额','本行含税总额，元','64,000']])+`<label>需要提取的列（逗号分隔，可增删改名）</label><input id="table-columns" value="${esc(s.tableColumns.join('，'))}">`+`<label>补充提取要求</label><textarea id="table-requirement">跨页表格合并，保留每行的原文定位。</textarea>`,btn('保存要求',"s.tableColumns=document.getElementById('table-columns').value.split(/[，,]/).map(x=>x.trim()).filter(Boolean);touch();closeModal();render();toast('明细要求已保存')",'primary'))}
function templateModal(){modal('选择提取模板',`<div class="tool-grid">${['通用字段提取','全文与结构','跨页表格明细'].map((n,i)=>`<div class="tool"><h3>${n}</h3><p>复用标准工具与SOP，按样例调整内容。</p>${btn('使用',`applyTemplate(${i})`,'small')}</div>`).join('')}</div>`)}
function applyTemplate(i){s.tasks=i===0?['字段提取']:i===1?['全文解析','结构还原']:['表格明细'];touch();closeModal();render()}
function batch(){let rows=s.batch.map((x,i)=>[esc(x.name),badge(x.status,x.status==='完成'?'green':x.status==='失败'?'red':'amber'),x.status==='完成'?'校验通过':'未评价',`v${x.version}`,x.status==='完成'?`${btn('结果',`batchDetail(${i})`,'small')} ${btn('下载',`downloadResult(${i})`,'small')}`:btn('重试',`retryBatch(${i})`,'small')]);return heading('批量任务','选定服务版本，批量上传、逐项核对并下载结果。',`${btn('演示批次','addBatch()')}${btn('上传文件','pickFiles("batch")','primary')}`)+metrics([['当前批次文件',String(s.batch.length),'按文件追踪'],['完成',String(s.batch.filter(x=>x.status==='完成').length),'支持单项下载'],['待处理',String(s.batch.filter(x=>x.status!=='完成').length),'逐项重试'],['实际服务版本',s.appVersion,'提交时固定执行快照']])+card('识别任务',`<div class="row spread" style="margin-bottom:18px"><div class="row"><select aria-label="批量场景"><option>${esc(s.name)}</option><option>银行流水解析</option></select><span class="pill">平台批量 · v${s.appVersion}</span></div><div class="row">${btn('重试失败项','retryAll()','small')}${btn('下载汇总 CSV','downloadBatch()','small')}</div></div>${rows.length?table(['文件','执行状态','质量状态','版本','操作'],rows):`<div class="empty">上传文件开始批量识别，或点击“演示批次”体验完整流程。</div>`}`)+note('正式产品支持 JSON、XLSX、全文及异常清单导出；原型提供 JSON 和 CSV 示例下载。')}
function addBatch(names){let ns=names||['采购合同_001.pdf','采购合同_002.pdf','采购合同_003.pdf'];s.batch.push(...ns.map((n,i)=>({name:n,status:i===ns.length-1?'失败':'完成',version:s.appVersion,fields:JSON.parse(JSON.stringify(s.appVersion==='1.1.0'&&s.publishedSnapshot?s.publishedSnapshot.fields:defaults.fields)),tasks:[...(s.appVersion==='1.1.0'&&s.publishedSnapshot?s.publishedSnapshot.tasks:defaults.tasks)],tableColumns:[...s.tableColumns]})));save();render();toast('演示批次已创建：含完成项和可重试项')}
function retryBatch(i){s.batch[i].status='完成';save();render();toast('示例重试完成，新增尝试记录 #2')}
function retryAll(){let n=0;s.batch.forEach(x=>{if(x.status==='失败'){x.status='完成';n++}});save();render();toast(n?`${n}个失败项模拟重试完成`:'没有待重试失败项')}
function resultObject(i){const fs=s.batch[i]?.fields||defaults.fields;const tasks=s.batch[i]?.tasks||defaults.tasks;return {task_id:'T-DEMO-'+(i+1),scene:s.name,scene_version:s.batch[i]?.version||s.appVersion,execution_status:'completed',quality_status:'validated',review_status:s.reviewed?'verified':'unverified',result_revision:s.reviewed?2:1,outputs:{fields:Object.fromEntries(fs.map((f,j)=>[f.name,{raw_value:exampleValue(j),normalized_value:exampleValue(j),extraction_status:'found',evidence_refs:['page-1-block-'+(j+1)]}])),tables:[{id:'items',columns:s.batch[i]?.tableColumns||s.tableColumns,rows:[['设备A',2,32000,64000],['设备B',2,32000,64000]]}],full_text:tasks.includes('全文解析')?'采购合同\n甲方：上海某贸易有限公司\n乙方：华东某设备有限公司':undefined,structure:tasks.includes('结构还原')?[{type:'heading',text:'采购合同',level:1,page:1}]:undefined,semantic:tasks.includes('语义要素')?[{name:'付款条件',value:'验收后付款',evidence_refs:['page-1-block-6']}]:undefined},evidence:[{id:'page-1-block-1',page:1}],usage:{pool_id:'pool-doc',model_calls:1},prototype:true}}
function downloadResult(i){download('提取结果_'+(i+1)+'.json',JSON.stringify(resultObject(i),null,2),'application/json')}
function downloadBatch(){if(!s.batch.length)return toast('请先创建批次');let lines=[['文件','版本','状态',...s.fields.map(x=>x.name)],...s.batch.map(x=>[x.name,x.version,x.status,...s.fields.map((_,i)=>x.status==='完成'?exampleValue(i):'')])];download('批量结果汇总.csv','\uFEFF'+lines.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function batchDetail(i){modal('单文件结果 · '+esc(s.batch[i].name),`<pre class="code">${esc(JSON.stringify(resultObject(i),null,2))}</pre>`,btn('下载 JSON',`downloadResult(${i})`,'primary'))}
const sourceFiles={
'scene.yaml':()=>`scene: contract_extract\nrevision: ${s.revision}\ntasks:\n${s.tasks.map(t=>'  - '+t).join('\n')}\nfields:\n${s.fields.map((f,i)=>'  - id: field_'+(i+1)+'\n    name: '+f.name+'\n    description: '+f.desc).join('\n')}\nsop: document_extract@2.1.0\nmodel_pool: pool-doc`,
'layouts.yaml':()=>`plans:\n  - id: contract_a\n    priority: 10\n    when:\n      title_contains: 采购合同\n      header_any: [商品名称, 含税单价]\n    fields: [contract_no, buyer, seller, amount]\n    aliases:\n      amount: [合同总价, 合同金额]\n  - id: contract_b\n    priority: 20\n    when:\n      filename_contains: 样式B\n      body_contains: 价税合计\n    fields: [contract_no, buyer, amount]\nno_match: general_plan\nequal_priority_conflict: require_confirmation`,
'prompt.md':()=>`# 通用字段提取\n依据字段定义读取文档，保留原文依据。\n\n- 金额提取含税总额，单位统一为元。\n- 每个结果关联材料、页码或内容块。\n- 未适用字段标记 not_applicable。\n- 应提取但未找到标记 not_found。\n\n输出符合 scene.yaml 的字段契约。`,
'normalize.py':()=>`def normalize_amount(value, unit="元"):\n    cleaned = str(value).replace(",", "")\n    amount = float(cleaned)\n    if unit == "万元":\n        amount *= 10000\n    return round(amount, 2)\n\n# 扩展代码关联代码仓库、构建及ADPM发布。`,

function develop(){return heading('AI 开发工作台','以自然语言开发，同步查看和修改工程资产。',`${badge('测试 · r'+s.revision,'amber')}${btn('保存检查点','checkpoint()')}${btn('评测',"go('evaluation')",'primary')}`)+`<div class="workbench"><section class="panel"><div class="panel-title">✦ 对话与执行 <span class="badge">工具与 SOP 已关联</span></div><div class="panel-body"><div class="chat" id="chat"><div class="message"><b>场景开发助手</b><p class="muted">已载入授权工具、SOP和当前场景。可以描述目标，也可直接编辑右侧文件。</p></div><div class="message user">基于样例提取采购合同要素，适配两种版式，提取单值合同字段。</div><div class="execution">✓ 读取样例与 scene.yaml<br>✓ 复用 document_extract@2.1.0<br>✓ 关联 OCR、字段提取、金额转换与校验</div>${s.chat.map(m=>`<div class="message ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join('')}${s.aiPending?`<div class="note green">建议已生成 · 2 项修改待采纳</div>`:''}</div><textarea id="chat-input" aria-label="开发需求" placeholder="例如：金额存在万元单位，请修复并跑回归"></textarea><div class="row" style="margin-top:10px">${btn('✦ 发送','sendAI()','primary small')}${btn('暂停','pauseAI()','small')}${btn('恢复','resumeAI()','small')}</div></div></section><section class="panel"><div class="panel-title">场景工程 <span class="tiny muted">配置 · 提示词 · 代码 · 流程</span></div><div class="file-tabs">${Object.keys(sourceFiles).map(f=>btn(f,`selectFile('${f}')`,s.file===f?'active':'')).join('')}</div><textarea id="code-editor" class="editor" spellcheck="false" aria-label="工程编辑器" oninput="s.code=this.value;s.fileContents[s.file]=this.value">${esc(s.code||sourceFiles[s.file]())}</textarea><div class="panel-body" style="border-top:1px solid var(--line)"><div class="row spread"><span class="tiny muted">${s.file==='normalize.py'?'代码变更 → 仓库 / ADPM / Jenkins':'配置变更 → 平台简化审核'}</span><div class="row">${btn(s.locked?'已锁定':'锁定文件','toggleLock()','small')}${btn('保存编辑','saveCode()','small')}${btn('运行示例','debugRun()','primary small')}</div></div>${s.aiPending?`<div class="diff">+ amount: normalize_unit(raw_value)<br>+ amount aliases: [合同总价, 价税合计]</div><div class="row">${btn('查看差异','diffModal()','small')}${btn('采纳配置项','applyAI(false)','small')}${btn('全部采纳','applyAI(true)','primary small')}${btn('撤销建议','dismissAI()','small')}</div>`:''}<details><summary>执行流程视图</summary><div class="flow"><div class="node">读取 / 质检</div><span class="arrow">→</span><div class="node">材料匹配</div><span class="arrow">→</span><div class="node">字段 ∥ 表格</div><span class="arrow">→</span><div class="node">转换 / 校验</div></div>${btn('绑定原子工具',"go('tools')",'small')}</details></div></section><section class="panel"><div class="panel-title">样例与运行结果 ${badge('示例')}</div><div class="panel-body"><div class="doc"><h3>采购合同</h3><p>合同编号：HT-2026-1026</p><p>甲方：上海某贸易有限公司</p><p>价税合计：<span class="highlight">12.8万元</span></p></div><div class="result"><span>标准化金额</span><b>${s.edits?'128,000.00':'12.80'}</b></div><div class="note ${s.edits?'green':'amber'}">${s.edits?'单位归一化示例已修复':'发现单位差异：原文万元，目标元。'}</div>${btn('将问题交给 AI','issueToAI()','small')}<details open><summary>工具追踪</summary><div class="tiny muted" style="margin-top:10px">native.read 84ms<br>plan.match 16ms · contract_b<br>fields.extract 1.4s<br>table.restore 920ms<br>value.normalize 6ms</div></details><div class="line"></div>${btn('恢复检查点','restoreCheckpoint()','small')} ${btn('提交代码','codeDelivery()','small')}</div></section></div>`}
function selectFile(f){s.file=f;s.code=s.fileContents[f]||'';save();render()}
function saveCode(){s.code=document.getElementById('code-editor').value;s.fileContents[s.file]=s.code;touch();render();toast('人工编辑已保存，当前修订需要重新评测')}
function toggleLock(){s.locked=!s.locked;save();render()}
function checkpoint(){s.checkpoint={fields:JSON.parse(JSON.stringify(s.fields)),code:s.code,revision:s.revision,edits:s.edits};save();toast('已保存工程检查点 r'+s.revision)}
function restoreCheckpoint(){if(!s.checkpoint)return toast('请先保存检查点');s.fields=s.checkpoint.fields;s.code=s.checkpoint.code;s.edits=s.checkpoint.edits;touch();render();toast('已恢复检查点内容，并生成新修订')}
function sendAI(){let t=document.getElementById('chat-input').value.trim();if(!t)return toast('请填写开发需求');s.chat.push({role:'user',text:t},{role:'ai',text:'模拟执行：读取当前工程、查询工具契约及SOP、检查金额归一化。已生成配置映射及代码修复建议，请查看差异并采纳。'});s.aiPending=true;save();render();document.getElementById('chat').scrollTop=9999}
function issueToAI(){s.chat.push({role:'user',text:'原文12.8万元，结果12.80元，请修复单位转换并回归。'});s.aiPending=true;save();render()}
function pauseAI(){toast('已暂停示例开发会话，可人工接手编辑')}
function resumeAI(){toast('示例会话已恢复，继续输入需求或查看待采纳建议')}
function diffModal(){modal('修改差异 · 基于 r'+s.revision,`<div class="tiny muted">layouts.yaml</div><div class="diff">+ amount aliases: [合同总价, 价税合计]</div><div class="tiny muted">normalize.py</div><div class="diff">+ if unit == "万元": amount *= 10000</div>${note('配置项进入简化变更；代码项进入ADPM交付。')}`)}
function applyAI(all){if(s.locked)return toast('当前文件已锁定，请解锁后采纳');if(all)s.edits++;s.aiPending=false;s.code='';touch();render();toast(all?'配置与代码建议已采纳，分别进入对应交付路径':'配置映射已采纳，请重新评测')}
function dismissAI(){s.aiPending=false;save();render()}

function evaluation(){let ok=s.evaluated&&s.evalRevision===s.revision;let fixed=Boolean(s.edits);return heading('调试评测','先核定答案，再按任务与版式自动比对，逐项判断准出。',`${btn('标注样例','labelSample()')}${btn('运行批量评测','runEvaluation()','primary')}`)+`<div class="tabs">${btn('评测报告',"tabState.eval='report';render()",tabState.eval==='report'?'active':'')}${btn('数据集与标注',"tabState.eval='dataset';render()",tabState.eval==='dataset'?'active':'')}${btn('版本对比',"tabState.eval='compare';render()",tabState.eval==='compare'?'active':'')}</div>`+(tabState.eval==='dataset'?card('数据集',table(['数据集','样例 / 标注版本','用途','覆盖','操作'],[['合同验收集','24份 / labels-v2','独立验收','样式A 12 / 样式B 12',btn('标注','labelSample()','small')],['合同回归集','18份 / labels-v3','回归','字段 / 表格 / 单位',btn('标注','labelSample()','small')]]))+note('AI预标注由人工确认后形成核定答案，同一答案资产可复用。'):tabState.eval==='compare'?card('同一数据集版本对比',table(['指标','v1.0.0','当前草稿','变化'],[['字段正确','90 / 96','95 / 96','+5'],['金额关键项','22 / 24','23 / 24','+1'],['明细单元格','188 / 192','190 / 192','+2'],['P95耗时','4.9s','4.7s','-0.2s']])):metrics([['字段正确槽位',ok?(fixed?'96 / 96':'95 / 96'):'待评测',ok?(fixed?'100% · 按核定槽位比对':'98.96% · 按核定槽位比对'):'运行批量评测生成报告'],['关键金额',ok?(fixed?'24 / 24':'23 / 24'):'—','标准：24 / 24'],['明细正确单元格',ok?'190 / 192':'—','98.96% · 对齐后比对'],['当前修订',`r${s.revision}`,ok?'报告 E-DEMO-1026 有效':'修改后旧报告保留为历史']])+card('质量准出',`<div class="row spread" style="margin-bottom:15px"><div><b>${esc(s.name)}</b> <span class="muted tiny">r${s.revision} · 24份合同 · labels-v2</span></div>${badge(ok?(fixed?'标准发布达标':'标准发布待达标'):'当前修订待评测','amber')}</div>${table(['必需项','当前结果','标准','状态'],[['字段整体',fixed?'96 / 96':'95 / 96','≥ 98%',ok?badge('通过','green'):badge('待运行','gray')],['合同金额 · 关键项',fixed?'24 / 24':'23 / 24','100%',ok?(fixed?badge('通过','green'):badge('未通过','amber')):badge('待运行','gray')],['明细单元格','190 / 192','≥ 98%',ok?badge('通过','green'):badge('待运行','gray')],['样例覆盖','样式A、B各12份','每组 ≥ 10份',ok?badge('通过','green'):badge('待运行','gray')]])}${note('上述为演示评测数据；实际报告按选定数据集、核定答案与工程快照计算。')}<div class="row">${btn('查看差异', function evaluation34(){let d=ds(),r=activeRun(),q=evalStats();return heading('场景评测','上传评测文件，选择版本运行，对照原文核定，再按标准生成报告。',btn('新建评测集','newDataset()')+btn('上传评测文件',"pickFiles('evaluation')",'primary'))+card('评测集与输入',`<div class="row spread"><select aria-label="评测集" onchange="switchDataset(this.value)">${s.datasets.map(x=>`<option value="${x.id}" ${d.id===x.id?'selected':''}>${esc(x.name)} / 数据修订${x.revision}</option>`).join('')}</select><span class="tiny muted">当前工程 r${s.revision} · ${s.mode==='fields'?'单值字段':'全文'} · ${testEnv()?'测试资源':'生产授权资源'}</span></div><div class="row" style="margin-top:14px">${btn('从样例选择',"chooseEvalSource('sample')",'small')}${btn('从识别任务选择',"chooseEvalSource('task')",'small')}${btn('导入标准答案','importAnswers()','small')}${btn('运行批量识别','runEvalRecognition()','primary small')}</div>${note('文件上传位于页面右上角，也可复用已有样例和任务。原型只登记上传文件名，预览与识别结果为模拟内容。')}`)+metrics(r?.mode==='fulltext'?[['评测文件',String(d.files.length),'按材料核定'],['运行',r.id.slice(-6),'固定场景修订和样本'],['标准确认',s.policy.confirmed?'已确认':'待确认','完整性、顺序和基本结构'],['当前报告',validReport()?(reportPass()?'达标':'待达标'):'待生成','覆盖与清单分别评价']]:[['评测文件',String(d.files.length),'数据修订'+d.revision],['原识别正确 / 已核定',q.correct+' / '+q.count,q.count?q.rate.toFixed(1)+'%':'尚未核定'],['核验覆盖',q.coverage.toFixed(1)+'%',q.count+' / '+q.total+'槽位'],['当前报告',validReport()?(reportPass()?'达标':'待达标'):'待生成','原机器输出与核定答案分别保存']])+qualityPolicy34()+card('文件与复核',d.files.length?table(['文件','分组','当前运行','操作'],d.files.map((f,i)=>[esc(f.name),esc(f.layout),r?(r.dataRevision===d.revision?badge('已识别','green'):badge('样本已变，需重跑','amber')):badge('待识别','gray'),(r&&r.dataRevision===d.revision?btn('原文复核',`openEvalReview(${i})`,'small'):'')+' '+btn('移除',`removeEvalFile(${i})`,'small')])):note('当前评测集为空，请上传文件或从样例选择。'))+card('评测报告与历史',`<p>当前运行：${r?esc(r.id)+' / r'+r.sceneRevision:'暂无'}。报告固定环境、场景修订、数据集、答案及标准版本。</p><div class="row" style="margin-top:14px">${btn('生成指标报告','runEvaluation()','primary')}${btn('查看差异','evalDiff()')}${btn('历史运行','evalHistory()')}${btn('去API发布',"go('services')")}</div>${note(testEnv()?'测试环境报告及材料可直接导出，生产发布时再按用途检查。':workflow()?'业务流程用途需要当前报告达标后进入生产发布。':'办公辅助批量评测可选。')}`)}
function qualityPolicy34(){if(s.mode==='fulltext')return card('全文标准',`<div class="row"><label>清单通过 ≥ <input id="p-full-rate" type="number" min="0" max="100" value="${s.fullPolicy?.rate??100}" style="width:70px"> %</label><label>覆盖 ≥ <input id="p-full-cover" type="number" min="0" max="100" value="${s.fullPolicy?.coverage??100}" style="width:70px"> %</label>${btn('保存标准','saveFullPolicy34()')}${btn(s.policy.confirmed?'标准已确认':'确认标准','confirmPolicy34()')}</div>`);let f=fieldDefs();return card('字段标准',`<div class="row"><label>整体 ≥ <input id="p-overall" type="number" min="0" max="100" value="${s.policy.overall}" style="width:70px"> %</label><label>覆盖 ≥ <input id="p-coverage" type="number" min="0" max="100" value="${s.policy.coverage}" style="width:70px"> %</label><label>关键字段 <select id="p-key"><option value="">不单列</option>${f.map(x=>`<option value="${x.id}" ${s.policy.criticalId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>关键项 ≥ <input id="p-critical" type="number" min="0" max="100" value="${s.policy.critical}" style="width:70px"> %</label></div><div class="row" style="margin-top:12px">${btn('保存标准','savePolicy34()')}${btn(s.policy.confirmed?'标准已确认':'业务与应用负责人确认','confirmPolicy34()')}</div><p class="tiny muted" style="margin-top:10px">标准按场景确认。未核验、无法确认单列，修改核定值不覆盖机器原值。</p>`)}

function submitDelivery36(){let type=document.getElementById('delivery-type36').value,note=document.getElementById('delivery-note36').value.trim();if(!note)return toast('填写变更说明');if(type==='config'&&(!validReport()||!reportPass()))return toast('请先确认标准，完成当前配置达标评测');let c=scene35(),x={id:uid34('DEL'),name:s.name,sceneId:c.id,type,note,snapshot:clone35(snapshot35()),report:type==='config'?clone35(ds().report):null,status:type==='config'?'待审核':'待构建',timeline:[{time:time36(),actor:user35,action:'创建交付单',note}],createdAt:time36()};s.deliveries36.unshift(x);if(type==='config'){let a=newApproval36(c,'config',{deliveryId:x.id,purpose:'开发配置简化变更',snapshot:x.snapshot,report:x.report,effective:'待审核及生产验证'});x.approvalId=a.id}save();closeModal();render();deliveryDetail36(x.id)}
function deliveryDetail36(id){let x=s.deliveries36.find(x=>x.id===id);if(!x)return;let body=table(['项目','内容'],[['交付说明',esc(x.note)],['当前状态',esc(x.status)],['下一步',esc(deliveryNext36(x))],['配置快照','r'+x.snapshot.revision],['ADPM单号',esc(x.adpm||'待登记')],['仓库提交',esc(x.commit||'待登记')],['Jenkins构建',esc(x.build||'待登记')]])+table(['时间','处理人','记录'],x.timeline.map(t=>[esc(t.time),esc(t.actor),esc(t.action)+' '+esc(t.note||'')]));let footer='';if(x.status==='待审核')footer=btn('查看审批进度',`closeModal();openApproval36('${x.approvalId}')`);if(x.status==='待构建'){body+=`<label>ADPM单号</label><input id="delivery-adpm36"><label>仓库提交号</label><input id="delivery-commit36"><label>Jenkins构建及产物</label><input id="delivery-build36">`;footer=btn('登记构建完成（演示）',`advanceDelivery36('${id}')`,'primary')}if(x.status==='待换版')footer=btn('记录应用支持已换版（演示）',`advanceDelivery36('${id}')`,'primary');if(x.status==='待生产验证'){body+=`<label>生产验证说明</label><textarea id="delivery-verify36" placeholder="记录部署版本、验证任务及结果"></textarea>`;footer=btn('验证通过并登记可用（演示）',`advanceDelivery36('${id}')`,'primary')}modal('开发交付详情',body+note('此原型演示状态登记；实际ADPM、Jenkins及服务器换版由研发流程执行，页面展示对应单号及结果。'),footer)}
function advanceDelivery36(id){let x=s.deliveries36.find(x=>x.id===id),actor='开发人员',note='';if(x.status==='待构建'){let a=document.getElementById('delivery-adpm36').value.trim(),c=document.getElementById('delivery-commit36').value.trim(),b=document.getElementById('delivery-build36').value.trim();if(!a||!b||!c)return toast('填写ADPM、提交号和构建产物');Object.assign(x,{adpm:a,commit:c,build:b,status:'待换版'})}else if(x.status==='待换版'){x.status='待生产验证';actor='应用支持'}else if(x.status==='待生产验证'){note=document.getElementById('delivery-verify36').value.trim();if(!note)return toast('填写生产验证结果');x.status='已完成';actor='发布人员';x.productionVersion='prod-'+x.id;if(x.approvalId){let a=record36(x.approvalId);a.effective='生产验证完成，版本可供应用绑定';log36(a,'生产验证完成',actor,note);notice36(a,a.effective)}}else return;x.timeline.push({time:time36(),actor,action:x.status,note});save();closeModal();render();deliveryDetail36(id)}
const evaluationBase36=evaluation;
evaluation=function(){return evaluationBase36().replaceAll('评测报告与历史','报告与评测记录').replaceAll('历史运行','查看评测记录').replaceAll('去API发布','去开发投产').replaceAll("go(&#39;services&#39;)","go(&#39;release&#39;)").replace('每次运行固定所选版本快照，历史运行保留。','每次评测保存独立记录，用于比较调整前后的效果。').replace('测试环境报告及材料可直接导出，生产发布时再按用途检查。','评测记录保存配置、样本与报告快照；业务批量文件在识别任务中查看。')};
const reportBase36=runEvaluation;
runEvaluation=function(){reportBase36();let r=activeRun();if(r&&validReport()){r.reports36=r.reports36||[];r.reports36.push({id:uid34('REPORT'),createdAt:time36(),stats:clone35(evalStats()),policy:clone35(s.policy),fullPolicy:clone35(s.fullPolicy||{}),report:clone35(ds().report),passed:reportPass(),labels:clone35(ds().labels)});save()}};
evalHistory=function(){modal('评测记录',note('每次点击运行批量识别，生成一条评测记录。查看当时的配置、样本、机器输出及已生成报告，用于比较修改前后的效果；与生产批量任务分别管理。')+(ds().runs.length?table(['时间 / 记录','配置 / 样本','报告','操作'],ds().runs.map((r,i)=>[esc(r.createdAt)+'<br>'+esc(r.id),'r'+r.sceneRevision+' / '+r.files.length+'份',r.reports36?.length?r.reports36.length+'份报告':'未生成报告',btn('查看记录',`evalRecord36(${i})`,'small')])):note('尚无评测记录，先添加文件并运行批量识别。')))};
function evalRecord36(i){let r=ds().runs[i];if(!r)return;modal('评测记录详情',table(['项目','内容'],[['记录号',esc(r.id)],['环境',r.environment==='test'?'测试':'生产'],['配置修订','r'+r.sceneRevision],['数据修订',String(r.dataRevision)],['样本数量',String(r.files.length)]])+table(['文件','该次原始输出'],r.files.map((f,j)=>[esc(f.name),r.mode==='fields'?r.fields.map((x,k)=>esc(x.name)+'：'+esc(r.outputs[j][k])).join('<br>'):'全文清单评测']))+(r.reports36?.length?table(['报告时间','核定与覆盖','当时结论','操作'],r.reports36.map((q,j)=>[esc(q.createdAt),q.stats.count+'/'+q.stats.total+'，覆盖'+q.stats.coverage.toFixed(1)+'%',q.passed?'达标':'待达标',btn('下载报告快照',`downloadEval36(${i},${j})`,'small')])):note('当时未保存报告；生成当前指标报告后会保存报告快照。')),btn('返回记录列表','evalHistory()'))}
function downloadEval36(i,j){let r=ds().runs[i],q=r.reports36[j];download('评测报告_'+q.id+'.json',JSON.stringify({run_id:r.id,scene_revision:r.sceneRevision,data_revision:r.dataRevision,files:r.files,...q},null,2),'application/json')}
// Navigation naming remains consistent with the functional pages.
const renderBase36=render;
render=function(){renderBase36();let app=document.getElementById('app');app.innerHTML=app.innerHTML.replaceAll('资源与权限','审批与资源').replaceAll('投产交付','开发投产').replace('<div class="top-meta">','<div class="top-meta">'+btn('消息'+(s.notices36.filter(x=>!x.read).length?' '+s.notices36.filter(x=>!x.read).length:''),'notifications36()','small'))};
function notifications36(){modal('申请处理消息',s.notices36.length?table(['时间','消息','操作'],s.notices36.map((x,i)=>[esc(x.time),esc(x.text)+(x.read?'':' · 未读'),btn('查看',`readNotice36(${i})`,'small')])):note('暂无处理消息。审核通过、退回及生产验证完成后在此显示。'))}
function readNotice36(i){let x=s.notices36[i];x.read=true;save();closeModal();render();openApproval36(x.id)}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
